---
- name: 'Instalação de pacotes webserver'
  apt:
    pkg:
      - php8.2
      - php-pear
      - php8.2-curl
      - php8.2-gd
      - php8.2-intl
      - php8.2-xmlrpc
      - php8.2-mysql
      - apache2
      - python3-mysqldb
      - wget
      - zip
      - curl
      - vim
    state: present
    update_cache: yes
  when: ansible_os_family == 'Debian'
  tags:
    - install

- name: 'Diretorio do webserver'
  file:
    path: /srv/www
    state: directory
    owner: "{{ app_user }}"
    mode: '0775'
  tags:
    - configuracao

- name: 'Download e Extração do arquivo da aplicação'
  unarchive:
    src: http://forceclass-00.linuxforce.com.br/express/express.zip
    dest: /srv/www
    remote_src: yes
  tags:
    - download

- name: 'Substitui IP de Conexão com o Banco'
  replace:
    path: /srv/www/express/backup.php
    regexp: '192.168.1.20'
    replace: '172.17.177.102'
  tags:
    - configuracao

- name: 'Criando virtual host para pagina express.asf.com'
  template:
    src: express.conf
    dest: /etc/apache2/sites-available/express.conf
  notify: Restart Apache

- name: 'Controle de Diretório Virtual Host'
  template:
    src: direxpress.conf
    dest: /etc/apache2/conf-available/direxpress.conf
  notify: Restart Apache

- name: 'Entrada DNS arquivo /etc/hosts'
  template:
    src: hostsweb.conf
    dest: /etc/hosts

- name: 'Entrada DNS arquivo /etc/hosts na maquina controle'
  lineinfile:
    path: /etc/hosts
    line: "172.17.177.101 express.asf.com"
    state: present
  delegate_to: localhost
  become: yes

- name: 'Habilitar Arquivo de configuração express'
  shell: /usr/sbin/a2enconf direxpress.conf
  notify: Restart Apache

- name: 'Habilitar Site'
  shell: /usr/sbin/a2ensite express.conf
  notify: Reload Apache
